<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Diem</title>
  <desc id="desc">Two interlocking calendar outlines in platinum and champagne gold on a midnight navy background.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#19304a"/>
      <stop offset="0.62" stop-color="#101f35"/>
      <stop offset="1" stop-color="#091526"/>
    </radialGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.38" stop-color="#e3dfd4"/>
      <stop offset="0.72" stop-color="#c4c1b9"/>
      <stop offset="1" stop-color="#eeeae1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff0c5"/>
      <stop offset="0.42" stop-color="#efd29a"/>
      <stop offset="0.75" stop-color="#cba665"/>
      <stop offset="1" stop-color="#e9ca8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#020914" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1254" height="1254" fill="url(#background)"/>

  <!-- The platinum calendar passes behind the gold one at the top. -->
  <path d="M 700 413 H 335 C 282 413 239 455 239 508 V 785 C 239 838 282 880 335 880 H 586 C 675 880 733 829 733 741 V 664 C 733 611 693 574 638 574 H 609"
        fill="none" stroke="url(#platinum)" stroke-width="96" stroke-linecap="butt" stroke-linejoin="round" filter="url(#shadow)"/>

  <path d="M 650 880 H 920 C 973 880 1016 838 1016 785 V 508 C 1016 455 973 413 920 413 H 697 C 611 413 556 480 556 571 V 660 C 556 719 601 728 684 728"
        fill="none" stroke="url(#gold)" stroke-width="96" stroke-linecap="butt" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- The lower platinum arc comes back in front, completing the linked effect. -->
  <path d="M 613 574 C 681 574 733 615 733 681 V 740 C 733 828 675 880 586 880 H 335"
        fill="none" stroke="url(#platinum)" stroke-width="96" stroke-linecap="butt" stroke-linejoin="round"/>

  <rect x="367" y="291" width="99" height="166" rx="39" fill="url(#platinum)" filter="url(#shadow)"/>
  <rect x="788" y="291" width="99" height="166" rx="39" fill="url(#gold)" filter="url(#shadow)"/>
</svg>
