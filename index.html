<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pair Board">
<title>Pair Board</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css?v=de26d44e">
</head>
<body>

<header class="head">
  <div class="head-top">
    <div class="brand">Pair&nbsp;Board</div>
    <div id="syncBar" class="syncbar" title="同期の様子"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" class="tab on" data-view="cal">カレンダー</button>
    <button type="button" class="tab" data-view="exp">立替金</button>
    <button type="button" class="tab" data-view="set">設定</button>
  </nav>
</header>

<main>

  <!-- ============ カレンダー ============ -->
  <section id="view-cal" class="view on">
    <div class="calhead">
      <button type="button" class="nav" id="prevMonth" aria-label="前の月">‹</button>
      <div class="month" id="monthLabel"></div>
      <button type="button" class="nav" id="nextMonth" aria-label="次の月">›</button>
      <button type="button" class="today" id="todayBtn">今日</button>
    </div>

    <div class="filters" id="filters">
      <button type="button" class="chip on" data-filter="all">全部</button>
      <button type="button" class="chip" data-filter="shared">2人の予定</button>
      <button type="button" class="chip" data-filter="private">自分だけ</button>
    </div>

    <div class="dow">
      <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="daypanel" id="dayPanel"></div>
  </section>

  <!-- ============ 立替金 ============ -->
  <section id="view-exp" class="view">
    <div class="trippick">
      <select id="tripSelect" aria-label="旅行を選ぶ"></select>
      <button type="button" class="mini" id="addTrip">旅行を足す</button>
      <button type="button" class="mini" id="editTrip">この旅行を直す</button>
    </div>
    <div id="expBody"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="view-set" class="view">
    <div id="setBody"></div>
  </section>

</main>

<button type="button" class="fab" id="fab" aria-label="足す">＋</button>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js?v=de26d44e"></script>
<script src="js/store.js?v=de26d44e"></script>
<script src="js/sync.js?v=de26d44e"></script>
<script src="js/calendar.js?v=de26d44e"></script>
<script src="js/expense.js?v=de26d44e"></script>
<script src="js/app.js?v=de26d44e"></script>
</body>
</html>
