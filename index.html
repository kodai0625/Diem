<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diem">
<title>Diem</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=1b3c66d4">
<link rel="stylesheet" href="css/deco.css?v=1b3c66d4">
</head>
<body>

<header class="head">
  <div class="head-top">
    <div class="brand">
      <svg class="logo" viewBox="185 285 885 650" width="27" height="20" aria-hidden="true">
      <defs>
      <linearGradient id="pbl-platinum" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.38" stop-color="#e3dfd4"/>
      <stop offset="0.72" stop-color="#c4c1b9"/>
      <stop offset="1" stop-color="#eeeae1"/>
      </linearGradient>
      <linearGradient id="pbl-gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff0c5"/>
      <stop offset="0.42" stop-color="#efd29a"/>
      <stop offset="0.75" stop-color="#cba665"/>
      <stop offset="1" stop-color="#e9ca8f"/>
      </linearGradient>
      </defs>
      <path d="M 700 413 H 335 C 282 413 239 455 239 508 V 785 C 239 838 282 880 335 880 H 586 C 675 880 733 829 733 741 V 664 C 733 611 693 574 638 574 H 609"
      fill="none" stroke="url(#pbl-platinum)" stroke-width="96" stroke-linecap="butt" stroke-linejoin="round"/>
      <path d="M 650 880 H 920 C 973 880 1016 838 1016 785 V 508 C 1016 455 973 413 920 413 H 697 C 611 413 556 480 556 571 V 660 C 556 719 601 728 684 728"
      fill="none" stroke="url(#pbl-gold)" stroke-width="96" stroke-linecap="butt" stroke-linejoin="round"/>
      <path d="M 613 574 C 681 574 733 615 733 681 V 740 C 733 828 675 880 586 880 H 335"
      fill="none" stroke="url(#pbl-platinum)" stroke-width="96" stroke-linecap="butt" stroke-linejoin="round"/>
      <rect x="367" y="291" width="99" height="166" rx="39" fill="url(#pbl-platinum)"/>
      <rect x="788" y="291" width="99" height="166" rx="39" fill="url(#pbl-gold)"/>
      </svg>
      <span>Diem</span>
    </div>
    <div id="syncBar" class="syncbar" title="同期の様子"></div>
    <button type="button" class="gear" id="setBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
        <path fill="currentColor" d="m19.4 13-.1-1 .1-1 1.6-1.2a.6.6 0 0 0 .2-.8l-1.6-2.7a.6.6 0 0 0-.7-.3l-1.9.7a6.9 6.9 0 0 0-1.7-1l-.3-2a.6.6 0 0 0-.6-.5h-3.2a.6.6 0 0 0-.6.5l-.3 2a6.9 6.9 0 0 0-1.7 1l-1.9-.7a.6.6 0 0 0-.7.3L4.4 9a.6.6 0 0 0 .2.8L6.2 11l-.1 1 .1 1-1.6 1.2a.6.6 0 0 0-.2.8l1.6 2.7c.1.3.4.4.7.3l1.9-.7c.5.4 1.1.8 1.7 1l.3 2c0 .3.3.5.6.5h3.2c.3 0 .6-.2.6-.5l.3-2c.6-.2 1.2-.6 1.7-1l1.9.7c.3.1.6 0 .7-.3l1.6-2.7a.6.6 0 0 0-.2-.8L19.4 13Zm-1.6 3.6-1.6-.6-.7.6c-.4.3-.9.6-1.4.8l-.9.3-.3 1.7h-1.8l-.3-1.7-.9-.3c-.5-.2-1-.5-1.4-.8l-.7-.6-1.6.6-.9-1.5 1.4-1 -.1-.9a5.6 5.6 0 0 1 0-1.6l.1-.9-1.4-1 .9-1.5 1.6.6.7-.6c.4-.3.9-.6 1.4-.8l.9-.3.3-1.7h1.8l.3 1.7.9.3c.5.2 1 .5 1.4.8l.7.6 1.6-.6.9 1.5-1.4 1 .1.9a5.6 5.6 0 0 1 0 1.6l-.1.9 1.4 1-.9 1.5Z"/>
      </svg>
    </button>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" class="tab on" data-view="cal">カレンダー</button>
    <button type="button" class="tab" data-view="feed">これから</button>
    <button type="button" class="tab" data-view="exp">立替金</button>
  </nav>
</header>

<main>

  <!-- ============ カレンダー ============ -->
  <section id="view-cal" class="view on">
    <div class="calhead">
      <button type="button" class="nav" id="prevMonth" aria-label="前の月">‹</button>
      <div class="month" id="monthLabel"></div>
      <button type="button" class="nav" id="nextMonth" aria-label="次の月">›</button>
      <button type="button" class="today" id="todayBtn">今日</button>
    </div>

    <div class="filters" id="filters">
      <button type="button" class="chip on" data-filter="all">全部</button>
      <button type="button" class="chip" data-filter="shared">2人の予定</button>
      <button type="button" class="chip" data-filter="private">自分だけ</button>
    </div>

    <div class="dow">
      <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="daypanel" id="dayPanel"></div>
  </section>

  <!-- ============ これから（近い予定を日付順に） ============ -->
  <section id="view-feed" class="view">
    <div id="feedBody"></div>
  </section>

  <!-- ============ 立替金 ============ -->
  <section id="view-exp" class="view">
    <div class="trippick">
      <button type="button" class="mini wide" id="addExpense">立替を記録する</button>
    </div>
    <div id="expBody"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="view-set" class="view">
    <div id="setBody"></div>
  </section>

</main>

<button type="button" class="fab" id="fab" aria-label="足す">＋</button>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js?v=1b3c66d4"></script>
<script src="js/store.js?v=1b3c66d4"></script>
<script src="js/sync.js?v=1b3c66d4"></script>
<script src="js/calendar.js?v=1b3c66d4"></script>
<script src="js/expense.js?v=1b3c66d4"></script>
<script src="js/tasks.js?v=1b3c66d4"></script>
<script src="js/app.js?v=1b3c66d4"></script>
</body>
</html>
